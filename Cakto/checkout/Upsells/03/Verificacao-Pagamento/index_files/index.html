<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

</head>
<body>
  <script src="./1699141243881620" async=""></script><script async="" src="./fbevents.js"></script><script>
    // Javascript Param Getting function
    function getUrlParameter(name) {
        name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
        var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
        var results = regex.exec(location.search);
        return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    };

    // FACEBOOK script
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');

    let eventId = getUrlParameter("event_id");
    let fbc = getUrlParameter("fbc");
    function trackFBPixel(action, eventName, body = null, advancedMatchingParams = null) {
      if (!eventId) {
         fbq(action, eventName, body);
       } else {
         fbq(action, eventName, body, { ...advancedMatchingParams, eventID: eventName.toLowerCase() + "_" + eventId, fbc: fbc });
       }
      console.log('Facebook Pixel Event:', { action, eventName, body, eventID: eventName.toLowerCase() + "_" + eventId, advancedMatchingParams });
    }

    // get facebook pixel
    const pixel = getUrlParameter("pixel");
    // start with pixel purchase data
    var pixelPurchaseData = {};

    if(pixel){

      // get product data
      let currency = getUrlParameter("currency");
      let productPrice = getUrlParameter("product_price");
      let productId = getUrlParameter("product_id");
      let productName = getUrlParameter("product_name");

      fbq('init', pixel);

      trackFBPixel('track', "PageView");

      if(productPrice && productId && productName){

        // set content for everyone
        pixelPurchaseData = {
          currency: (currency || "BRL"),
          value: productPrice,
          contents: [{
            "id": productId,
            "name": productName,
            "quantity": 1
          }],
          content_type: "product",
        };

        trackFBPixel('track', "InitiateCheckout", pixelPurchaseData);
      }
        console.log('Facebook pixel' + pixel);
    }

    window.onload = function() {

      // listening from events from checkout
      window.addEventListener('message', function(e) {

        if(typeof e.data == 'string'){

          var message = JSON.parse(e.data);

          if(message.content_data){
            // for custom content_data
            pixelPurchaseData = message.content_data;
          }

          if (message.event === "Purchase") {
            // Reinitialize pixel for purchase events
            fbq('init', pixel, {
              external_id: message.external_id,
            });
          }

          if (message.product_price) {
            pixelPurchaseData.value = message.product_price;
          }

          if(['track','trackCustom'].indexOf(message.event_type) > -1
          && message.event){
            // only if track or custom & event exists
            if(message.event_type == "track"){
              if (
                message.custom_data &&
                typeof message.custom_data === 'object' &&
                Object.keys(message.custom_data).length > 0
              ) {
                trackFBPixel(message.event_type, message.event, Object.assign({}, pixelPurchaseData, message.custom_data));
              } else {
                trackFBPixel(message.event_type, message.event, pixelPurchaseData);
              }
            }else{
              if(message.event == 'boleto'){
                trackFBPixel(message.event_type, message.event, pixelPurchaseData);
              }else{
                trackFBPixel(message.event_type, message.event, {});
              }
            }
          }
        }

      });
    };

  </script>


</body></html>
