  <script>
    (function () {
      "use strict";

      var currentParams = new URLSearchParams(window.location.search);
      var pixCode = currentParams.get("pix_code") || localStorage.getItem("pix_qr_code") || "";
      var pixHash = currentParams.get("pix_hash") || localStorage.getItem("pix_hash") || "";

      function redirectToNext() {
        var p = new URLSearchParams(window.location.search);
        if (pixCode) p.set("pix_code", pixCode);
        if (pixHash) p.set("pix_hash", pixHash);
        window.location.href = "../../../../obrigado/index.html?" + p.toString();
      }

      // Copiar código PIX
      var copyBtns = Array.from(document.querySelectorAll("button, a")).filter(function(b) {
        return b.innerText && b.innerText.toLowerCase().indexOf("copiar") !== -1;
      });

      copyBtns.forEach(function(btn) {
        btn.addEventListener("click", function(e) {
          e.preventDefault();
          if (!pixCode) return;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(pixCode).then(function() {
              var origText = btn.innerHTML;
              btn.innerHTML = '<span style="color:#0B6856; font-weight:bold;">✓ Código Copiado!</span>';
              setTimeout(function() { btn.innerHTML = origText; }, 3000);
            });
          } else {
            var ta = document.createElement("textarea");
            ta.value = pixCode;
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand("copy"); } catch(e){}
            document.body.removeChild(ta);
            var origText = btn.innerHTML;
            btn.innerHTML = '<span style="color:#0B6856; font-weight:bold;">✓ Código Copiado!</span>';
            setTimeout(function() { btn.innerHTML = origText; }, 3000);
          }
        });
      });

      // Botão 'Já fiz o pagamento' (VERIFICA NA PRÓPRIA TELA SEM SAIR)
      var payBtns = Array.from(document.querySelectorAll("button, a")).filter(function(b) {
        return b.innerText && b.innerText.toLowerCase().indexOf("fiz o pagamento") !== -1;
      });

      payBtns.forEach(function(btn) {
        btn.addEventListener("click", function(e) {
          e.preventDefault();
          
          var oldNotice = document.getElementById("caktoPayNotice");
          if (oldNotice) oldNotice.remove();

          var origHtml = btn.innerHTML;
          btn.disabled = true;
          btn.innerHTML = '<span style="display:inline-flex; align-items:center; justify-content:center; gap:8px;"><svg class="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path></svg> Verificando pagamento...</span>';

          if (pixHash && window.CaktoAPI && typeof window.CaktoAPI.consultPix === "function") {
            window.CaktoAPI.consultPix(pixHash)
              .then(function(res) {
                btn.disabled = false;
                btn.innerHTML = origHtml;
                if (res && res.is_paid) {
                  btn.style.backgroundColor = "#10b981";
                  btn.innerHTML = "✓ Pagamento Confirmado!";
                  setTimeout(redirectToNext, 1000);
                } else {
                  showUnpaidNotice(btn);
                }
              })
              .catch(function() {
                btn.disabled = false;
                btn.innerHTML = origHtml;
                showUnpaidNotice(btn);
              });
          } else {
            setTimeout(function() {
              btn.disabled = false;
              btn.innerHTML = origHtml;
              showUnpaidNotice(btn);
            }, 1200);
          }
        });
      });

      function showUnpaidNotice(targetBtn) {
        var notice = document.createElement("div");
        notice.id = "caktoPayNotice";
        notice.style.backgroundColor = "#fffbeb";
        notice.style.border = "1px solid #fde68a";
        notice.style.color = "#92400e";
        notice.style.padding = "10px 14px";
        notice.style.borderRadius = "8px";
        notice.style.fontSize = "12px";
        notice.style.fontWeight = "600";
        notice.style.textAlign = "center";
        notice.style.marginTop = "10px";
        notice.style.lineHeight = "1.4";
        notice.innerHTML = "Pagamento ainda em processamento pelo banco. Se você já pagou no app do seu banco, aguarde alguns instantes pela compensação.";
        targetBtn.parentNode.insertBefore(notice, targetBtn.nextSibling);
      }

      // Background polling automático
      if (pixHash && window.CaktoAPI && typeof window.CaktoAPI.consultPix === "function") {
        var pollInterval = setInterval(function() {
          window.CaktoAPI.consultPix(pixHash)
            .then(function(res) {
              if (res && res.is_paid) {
                clearInterval(pollInterval);
                redirectToNext();
              }
            })
            .catch(function() {});
        }, 3500);
      }
    })();
  </script>
