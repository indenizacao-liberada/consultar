<!DOCTYPE html>
<!-- saved from url=(0185)https://pixels.kiwify.com.br/pixel.html?pixel=1699141243881620&currency=BRL&product_price=129.82&event_id=7oyontc1ol0i4lguk0&product_name=Cultivo%2021%20dias&product_id=SqTU9U5&fbc=null -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="kiwify" id="kiwify" content="confirmed">
  <title>pixel</title>
<script src="pepper-api.js"></script>
</head>
<body>
  <script>
    // Javascript Param Getting function
    function getUrlParameter(name) {
        name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
        var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
        var results = regex.exec(location.search);
        return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    };

    // get facebook pixel
    const pixel = getUrlParameter("pixel");
    // start with pixel purchase data
    var pixelPurchaseData = {};

    if(pixel){

      // get product data
      let currency = getUrlParameter("currency");
      let productPrice = getUrlParameter("product_price");
      let productId = getUrlParameter("product_id");
      let productName = getUrlParameter("product_name");
      let eventId = getUrlParameter("event_id");
      let fbc = getUrlParameter("fbc");
      if (!eventId || eventId === 'null' || eventId === 'undefined') {
        eventId = '';
      }

      let iframeUrl = "index.html?pixel="+pixel+"&product_price="+productPrice+"&product_id="+productId+"&product_name="+productName+"&event_id="+eventId+"&currency="+currency+"&fbc="+fbc;

      var iframe = document.createElement("iframe");
      iframe.src = iframeUrl;
      iframe.width = "1px";
      iframe.id = "pixelIframe";
      iframe.height = "1px";
      iframe.name = "frame";
      iframe.frameBorder = 0;
      document.body.appendChild(iframe);
      // now listen for messages and post to the iframe

      window.onload = function() {

        // listening from events from checkout
        window.addEventListener('message', function(e) {

          if(typeof e.data === 'string'){
            var message = JSON.parse(e.data);

            pixelIframe.contentWindow.postMessage(e.data, '*');
          }
        });
      };

      console.log('Facebook pixel iframe' + pixel);
    }

  </script><iframe src="./index.html" width="1px" id="pixelIframe" height="1px" name="frame" frameborder="0"></iframe>

</body></html>
