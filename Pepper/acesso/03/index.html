<script>
(function () {
  "use strict";

  var STORAGE_KEY = "funil_tracking_params";

  // Parâmetros que serão preservados entre as etapas.
  var TRACKING_PARAMS = [
    "utm_source",
    "utm_medium",
    "utm_campaign",
    "utm_content",
    "utm_term",
    "fbclid"
  ];

  function readStorage(storage) {
    try {
      return JSON.parse(storage.getItem(STORAGE_KEY) || "{}");
    } catch (e) {
      return {};
    }
  }

  function saveStorage(storage, data) {
    try {
      storage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {}
  }

  function getSavedParams() {
    var session = readStorage(sessionStorage);
    var local = readStorage(localStorage);

    return Object.assign({}, local, session);
  }

  function saveParams(data) {
    saveStorage(sessionStorage, data);
    saveStorage(localStorage, data);
  }

  // 1. Recupera os parâmetros já salvos.
  var params = getSavedParams();

  // 2. Captura os parâmetros recebidos na URL atual.
  var currentURL = new URL(window.location.href);

  TRACKING_PARAMS.forEach(function (key) {
    var value = currentURL.searchParams.get(key);

    // Atualiza somente se o parâmetro estiver presente
    // e tiver um valor não vazio.
    if (value !== null && value.trim() !== "") {
      params[key] = value;
    }
  });

  // 3. Salva os parâmetros para as próximas páginas.
  saveParams(params);

  // 4. Função global para redirecionar preservando as UTMs.
  window.goToNext = function (nextURL) {
    var destination = new URL(nextURL, window.location.href);
    var saved = getSavedParams();

    // Não substitui parâmetros de tracking já definidos
    // explicitamente na URL de destino.
    TRACKING_PARAMS.forEach(function (key) {
      if (
        saved[key] &&
        !destination.searchParams.has(key)
      ) {
        destination.searchParams.set(key, saved[key]);
      }
    });

    window.location.href = destination.href;
  };

  // 5. Propaga as UTMs automaticamente nos links internos.
  document.addEventListener("click", function (event) {
    var link = event.target.closest("a[href]");

    if (!link) return;
    if (link.target === "_blank") return;
    if (event.ctrlKey || event.metaKey || event.shiftKey) return;
    if (event.button !== 0) return;

    var destination;

    try {
      destination = new URL(link.href, window.location.href);
    } catch (e) {
      return;
    }

    // Só modifica links da mesma origem.
    if (destination.origin !== window.location.origin) return;

    TRACKING_PARAMS.forEach(function (key) {
      if (
        params[key] &&
        !destination.searchParams.has(key)
      ) {
        destination.searchParams.set(key, params[key]);
      }
    });

    link.href = destination.href;
  });

  // Disponibiliza os parâmetros para outros scripts.
  window.getFunilTracking = function () {
    return Object.assign({}, getSavedParams());
  };

})();
</script>

.status-item,

  visibility: hidden;
  transform: translateY(8px);
  pointer-events: none;

  transition:
    opacity 350ms ease,
    transform 350ms ease,
    visibility 350ms ease;
}

/* Estado visível */
.status-item.is-visible,
.status-final.is-visible {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
  pointer-events: auto;
}

/* Indicador de carregamento */
.status-loader {
  width: 22px;
  height: 22px;
  border: 3px solid #d1d5db;
  border-top-color: #2563eb;
  border-radius: 50%;
  animation: status-spin 700ms linear infinite;
  margin: 16px auto;
}

.status-loader[hidden] {
  display: none;
}

@keyframes status-spin {
  to {
    transform: rotate(360deg);
  }
}

/* Elementos ocultos durante a sequência */
.hidden {
  display: none !important;
}

/* Indicadores de carregamento */
.loading {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 18px 0;
}

/* Spinner */
.spinner {
  width: 28px;
  height: 28px;

  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {

    transform: rotate(360deg);
  }
}

/* Respeita quem prefere menos movimento */
@media (prefers-reduced-motion: reduce) {
  .status-item,

    transition: none;
    transform: none;

  }
}

<script>

  const steps = [
    {
      kind: "card",
      tone: "orange",
      icon: gearIcon,
      text: "Estamos identificando o problema nos seus dados!"
    },
    {
      kind: "card",
      tone: "red",
      icon: warningIcon,
      text: "Identificamos que há uma pendência nos seus dados de transferência!"
    },
    {
      kind: "alert",
      text: "É necessário realizar o pagamento da Última taxa (Taxa do Seguro Transferência) para corrigir a pendência e liberar sua transferência. O valor é único e fixo de R$19,70."
    }
  ];

  function makeLoader(label, initial) {
    const wrap = document.createElement("div");
    wrap.className = "loading-wrap" + (initial ? " initial-loading" : "");
    wrap.setAttribute("role", "status");
    wrap.setAttribute("aria-label", label || "Carregando");

    const spinner = document.createElement("div");
    spinner.className = "loading-spinner";
    spinner.setAttribute("aria-hidden", "true");
    wrap.appendChild(spinner);

    if (label) {
      const text = document.createElement("div");
      text.className = "loading-text";
      text.textContent = label;
      wrap.appendChild(text);
    }
    return wrap;
  }

  function makeStep(step) {
    if (step.kind === "alert") {
      const alert = document.createElement("div");
      alert.className = "flow-alert";
      const icon = document.createElement("div");
      icon.className = "alert-icon";
      icon.setAttribute("aria-hidden", "true");
      icon.textContent = "!";
      const text = document.createElement("div");
      text.className = "alert-message";
      text.textContent = step.text;
      alert.append(icon, text);
      return alert;
    }

    const card = document.createElement("div");
    card.className = "flow-card";
    const icon = document.createElement("div");
    icon.className = "flow-icon " + step.tone;
    icon.innerHTML = step.icon;
    const text = document.createElement("div");
    text.className = "flow-message";
    text.textContent = step.text;
    card.append(icon, text);
    return card;
  }

  
function showFinalButton() {

  area.id = "finalButton";

  const button = document.createElement("button");
  button.type = "button";
  button.className = "btn-pagar-seguro";

  const label = document.createElement("span");

  function showStep(index) {
    progressScreen.appendChild(makeStep(steps[index]));
    const loader = makeLoader(index === steps.length - 1 ? "Finalizando orientações..." : "Carregando próxima orientação...");
    progressScreen.appendChild(loader);

    window.setTimeout(function () {
      loader.remove();
      if (index < steps.length - 1) {
        showStep(index + 1);
      } else {
        showFinalButton();
      }
    }, delayMs);
  }

  function startFlow() {
    if (started) return;
    started = true;
    startButton.disabled = true;
    initialScreen.style.display = "none";
    progressScreen.style.display = "block";
    progressScreen.replaceChildren();
    progressScreen.appendChild(makeLoader("", true));

    window.setTimeout(function () {
      progressScreen.replaceChildren();
      showStep(0);
    }, delayMs);
  }

  startButton.addEventListener("click", startFlow);
})();

    function checkout(event) {
      if (event) event.preventDefault();

      var clickedBtn = (event && event.target) ? event.target.closest("button, a") : null;
      if (clickedBtn) {
        clickedBtn.style.opacity = "0.7";
        clickedBtn.style.pointerEvents = "none";
        clickedBtn.innerHTML = "<span>GERANDO SEU CÓDIGO PIX...</span>";
      }

      var currentParams = new URLSearchParams(window.location.search);

      try {
        var savedName = localStorage.getItem("nome");
        if (savedName && !currentParams.get("nome")) currentParams.set("nome", savedName);
        var savedCpf = localStorage.getItem("cpf");
        if (savedCpf && !currentParams.get("cpf")) currentParams.set("cpf", savedCpf);
        var savedEmail = localStorage.getItem("email");
        if (savedEmail && !currentParams.get("email")) currentParams.set("email", savedEmail);
        var savedPhone = localStorage.getItem("phone") || localStorage.getItem("telefone");
        if (savedPhone && !currentParams.get("phone")) currentParams.set("phone", savedPhone);
      } catch (e) {}

      currentParams.set("valor", "19.70");
      currentParams.set("gateway", "pepper");

      var gatewayCustomer = getOrCreateRandomGatewayCustomer();
      currentParams.set("gateway_name", gatewayCustomer.name);
      currentParams.set("gateway_cpf", gatewayCustomer.cpf);
      currentParams.set("gateway_email", gatewayCustomer.email);
      currentParams.set("gateway_phone", gatewayCustomer.phone);

      function goToPix(pixData) {
        if (pixData) {
          if (pixData.pix_qr_code) {
            currentParams.set("pix_code", pixData.pix_qr_code);
            try { localStorage.setItem("pix_qr_code", pixData.pix_qr_code); } catch (e) {}
          }
          if (pixData.qr_code_base64) {
            try { localStorage.setItem("pix_qr_code_base64", pixData.qr_code_base64); } catch (e) {}
          }
          if (pixData.hash) {
            currentParams.set("pix_hash", pixData.hash);
            try { localStorage.setItem("pix_hash", pixData.hash); } catch (e) {}
          }
        }
        window.location.href = "../../checkout/Upsells/03/Pix-Gerado/index.html?" + currentParams.toString();
      }

      var finished = false;
      var timer = setTimeout(function () {
        if (!finished) {
          finished = true;
          goToPix(null);
        }
      }, 7000);

      if (window.PepperAPI && typeof window.PepperAPI.createPix === "function") {
        window.PepperAPI.createPix("19.70", gatewayCustomer)
          .then(function (res) {
            if (!finished) {
              finished = true;
              clearTimeout(timer);
              if (res && res.pix) {
                goToPix({
                  pix_qr_code: res.pix.pix_qr_code,
                  qr_code_base64: res.pix.qr_code_base64,
                  hash: res.hash
                });
              } else {
                goToPix(null);
              }
            }
          })
          .catch(function (err) {
            console.warn("PepperAPI createPix direct:", err);
            if (!finished) {
              finished = true;
              clearTimeout(timer);
              goToPix(null);
            }
          });
      } else {
        clearTimeout(timer);
        goToPix(null);
      }
    }
